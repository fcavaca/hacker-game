<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2a1a5e"/>
      <stop offset=".55" stop-color="#110c2a"/>
      <stop offset="1" stop-color="#06070d"/>
    </radialGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3dce"/>
      <stop offset=".55" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7896ff" stroke-opacity=".09" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#grid)"/>

  <!-- glow behind the hood -->
  <path d="M256 78C154 78 104 168 104 262V404c0 26 22 44 48 44h208c26 0 48-18 48-44V262C408 168 358 78 256 78Z" fill="#8a5cff" opacity=".55" filter="url(#soft)"/>

  <!-- glitch ghosts -->
  <path d="M256 78C154 78 104 168 104 262V404c0 26 22 44 48 44h208c26 0 48-18 48-44V262C408 168 358 78 256 78Z" fill="none" stroke="#00f0ff" stroke-width="6" opacity=".7" transform="translate(-9 3)"/>
  <path d="M256 78C154 78 104 168 104 262V404c0 26 22 44 48 44h208c26 0 48-18 48-44V262C408 168 358 78 256 78Z" fill="none" stroke="#ff3dce" stroke-width="6" opacity=".7" transform="translate(9 -3)"/>

  <!-- hood -->
  <path d="M256 78C154 78 104 168 104 262V404c0 26 22 44 48 44h208c26 0 48-18 48-44V262C408 168 358 78 256 78Z" fill="url(#hot)"/>
  <path d="M256 78C154 78 104 168 104 262V404c0 26 22 44 48 44h208c26 0 48-18 48-44V262C408 168 358 78 256 78Z" fill="url(#shine)"/>

  <!-- dark face -->
  <path d="M256 150c-62 0-94 56-94 116 0 70 42 122 94 122s94-52 94-122c0-60-32-116-94-116Z" fill="#06070d"/>

  <!-- headset band + ear cups -->
  <path d="M112 262C112 120 400 120 400 262" fill="none" stroke="#06070d" stroke-width="22" stroke-linecap="round"/>
  <path d="M112 262C112 120 400 120 400 262" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  <rect x="80" y="232" width="52" height="96" rx="22" fill="#0d1022" stroke="#00f0ff" stroke-width="6"/>
  <rect x="380" y="232" width="52" height="96" rx="22" fill="#0d1022" stroke="#00f0ff" stroke-width="6"/>
  <rect x="94" y="258" width="24" height="44" rx="10" fill="#ff3dce"/>
  <rect x="394" y="258" width="24" height="44" rx="10" fill="#ff3dce"/>
  <!-- mic -->
  <path d="M112 322c6 46 50 66 104 58" fill="none" stroke="#00f0ff" stroke-width="7" stroke-linecap="round"/>
  <circle cx="222" cy="379" r="11" fill="#00f0ff" filter="url(#glow)"/>

  <!-- angry glowing eyes -->
  <g fill="#00f0ff" filter="url(#glow)">
    <path d="M190 250l52 16-4 18-44-8Z"/>
    <path d="M322 250l-52 16 4 18 44-8Z"/>
  </g>
  <!-- code grin -->
  <text x="256" y="345" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-weight="700" font-size="38" fill="#ff3dce" filter="url(#glow)">&lt;/&gt;</text>

  <!-- glitch slices -->
  <rect x="150" y="196" width="120" height="7" fill="#00f0ff" opacity=".8"/>
  <rect x="300" y="414" width="90" height="6" fill="#ff3dce" opacity=".85"/>
  <rect x="60" y="120" width="60" height="5" fill="#ff3dce" opacity=".6"/>
  <rect x="380" y="152" width="70" height="5" fill="#00f0ff" opacity=".6"/>
</svg>
